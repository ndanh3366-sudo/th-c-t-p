    <script>
      // Clean, non-intrusive suppression of benign Vite HMR reconnection logs in preview
      (function() {
        var originalConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack || arg.toString())) || String(arg);
            if (str.indexOf('vite-hmr') !== -1 || str.indexOf('@vite/client') !== -1) {
              return;
            }
          }
          return originalConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
